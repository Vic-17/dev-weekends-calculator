<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator & Bill Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator-container">
    <header>
      <h1>Split-a-Bill</h1>
      <p>Easy tip & bill splitting</p>
    </header>

    <div class="card-layout">
      <!-- Input Section -->
      <section class="input-section">
        <!-- Bill Input -->
        <div class="input-group">
          <label for="bill">Bill Amount ($)</label>
          <div class="input-wrapper">
            <span class="currency-symbol">$</span>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0.01">
          </div>
          <span class="error-message" id="bill-error"></span>
        </div>

        <!-- Tip Percent Input -->
        <div class="input-group">
          <label>Select Tip %</label>
          <div class="tip-grid">
            <button type="button" class="tip-btn" data-tip="10">10%</button>
            <button type="button" class="tip-btn" data-tip="15">15%</button>
            <button type="button" class="tip-btn" data-tip="20">20%</button>
            <input type="number" id="custom-tip" class="custom-tip-input" placeholder="Custom" min="0" max="100">
          </div>
          <span class="error-message" id="tip-error"></span>
        </div>

        <!-- Number of People Input -->
        <div class="input-group">
          <label for="people">Number of People</label>
          <input type="number" id="people" placeholder="1" min="1" step="1">
          <span class="error-message" id="people-error"></span>
        </div>
      </section>

      <!-- Display Section -->
      <section class="display-section">
        <div class="display-row">
          <div>
            <h2>Total Tip</h2>
            <p class="per-person-label">Entire group</p>
          </div>
          <div class="amount" id="tip-total">$0.00</div>
        </div>

        <div class="display-row">
          <div>
            <h2>Grand Total</h2>
            <p class="per-person-label">Bill + Tip</p>
          </div>
          <div class="amount" id="grand-total">$0.00</div>
        </div>

        <div class="display-row highlight">
          <div>
            <h2>Per Person</h2>
            <p class="per-person-label">Equal share</p>
          </div>
          <div class="amount large" id="per-person-total">$0.00</div>
        </div>

        <button type="button" id="reset-btn" class="reset-btn" disabled>Reset</button>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
